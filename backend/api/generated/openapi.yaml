openapi: 3.0.0
info:
  title: Call Calendar API
  description: API для проверки состояния приложения Call Calendar.
  version: 0.0.0
tags:
  - name: Health
paths:
  /health:
    get:
      operationId: health
      description: Проверка доступности HTTP-сервера.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
      tags:
        - Health
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Состояние доступного приложения.
          example: ok
      description: Состояние приложения.
      example:
        status: ok
servers:
  - url: /
    description: Текущий сервер приложения
    variables: {}
